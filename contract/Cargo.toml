[package]
name = "sokonipay"
version = "0.1.0"
edition = "2021"
description = "SokoniPay: merchant registry, invoices, agent spending limits, group escrow and revenue splits"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
