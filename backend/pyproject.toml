[project]
name = "sokonipay-backend"
version = "0.1.0"
description = "SokoniPay API: accounts, orders, and the Personal and Merchant agents"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "cryptography>=43",
    "py-near>=1.2.22",
    "pynacl>=1.5",
    "base58>=2.1",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "langchain-core>=0.3",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
