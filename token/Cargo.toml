[package]
name = "susd-token"
version = "0.1.0"
edition = "2021"
description = "Demo NEP-141 stablecoin (sUSD) for SokoniPay on testnet only"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
